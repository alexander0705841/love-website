<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forever With You</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #f65b8b, #d83f70);
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    .hearts { position: fixed; inset: 0; pointer-events: none; }
    .heart { position: absolute; bottom: -30px; color: rgba(255,255,255,.55); font: var(--size) Arial; animation: rise var(--duration) linear infinite; animation-delay: var(--delay); }
    @keyframes rise { to { opacity: 0; transform: translateY(-110vh) rotate(30deg); } }
    .card { position: relative; z-index: 1; width: min(620px, calc(100% - 32px)); padding: 58px 28px; border: 1px solid rgba(255,255,255,.5); border-radius: 32px; background: rgba(255,255,255,.14); box-shadow: 0 25px 80px rgba(112,20,55,.25); animation: appear .8s cubic-bezier(.2,1.3,.4,1) both; }
    @keyframes appear { from { opacity: 0; transform: scale(.7) translateY(35px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .heart-icon { font-size: 4rem; animation: beat 1.4s ease-in-out infinite; }
    @keyframes beat { 50% { transform: scale(1.16); } }
    h1 { margin: 15px 0 12px; font-size: clamp(2.5rem, 8vw, 4.7rem); font-weight: 400; }
    p { margin: 0; font-size: 1.15rem; line-height: 1.7; }
    a { display: inline-block; margin-top: 28px; border-radius: 999px; padding: 13px 22px; background: white; color: #d83f70; font: 700 .78rem Arial; text-decoration: none; }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart" style="--size:20px;--duration:10s;--delay:0s;left:8%">♥</span>
    <span class="heart" style="--size:28px;--duration:13s;--delay:3s;left:32%">♥</span>
    <span class="heart" style="--size:18px;--duration:11s;--delay:6s;left:63%">♥</span>
    <span class="heart" style="--size:24px;--duration:14s;--delay:2s;left:87%">♥</span>
  </div>
  <main class="card">
    <div class="heart-icon">♥</div>
    <h1>I LOVE YOU</h1>
    <p>THANK YOU FOR SAYING YES.<br>OUR NEXT BEAUTIFUL MEMORY STARTS ON 16 NOVEMBER 2026.</p>
    <a href="index.html">BACK TO OUR DATE ♥</a>
  </main>
</body>
</html>
